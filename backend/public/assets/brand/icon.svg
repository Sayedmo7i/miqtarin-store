<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1F"/>
      <stop offset="100%" stop-color="#141112"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2305E"/>
      <stop offset="100%" stop-color="#B52046"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#B52046" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#iconBgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Icon Symbol -->
  <g transform="translate(18, 14)" filter="url(#iconGlow)">
    <!-- Bag Handle -->
    <path d="M 33 26 C 33 11, 51 11, 51 26" fill="none" stroke="url(#mGrad)" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Stylized M Bag -->
    <path d="M 12 32 L 27 78 L 42 54 L 57 78 L 72 32 Z" fill="url(#mGrad)"/>
    
    <!-- Subtle Cart / Bag dynamic cut -->
    <path d="M 14 36 L 42 66 L 70 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
