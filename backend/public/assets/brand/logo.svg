<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92858"/>
      <stop offset="100%" stop-color="#991636"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B52046"/>
      <stop offset="100%" stop-color="#7C112C"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#B52046" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Bag Handle -->
    <path d="M 40 38 C 40 18, 60 18, 60 38" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Stylized Bag / M Monogram -->
    <path d="M 22 42 L 35 92 L 50 68 L 65 92 L 78 42 Z" fill="url(#bagGrad)"/>
    
    <!-- Bag Base Outline Accent -->
    <path d="M 20 42 C 18 42, 16 45, 17 48 L 26 95 C 27 98, 30 100, 33 100 L 67 100 C 70 100, 73 98, 74 95 L 83 48 C 84 45, 82 42, 80 42 Z" fill="none" stroke="#201A1A" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Shopping Bag Front Flap Line -->
    <path d="M 22 46 L 50 76 L 78 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- Latin Brand Name -->
  <text x="115" y="65" font-family="'Rubik', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#201A1A" letter-spacing="-0.5">
    Mo7i<tspan fill="#B52046">.</tspan><tspan fill="#B52046" font-weight="700">Store</tspan>
  </text>

  <!-- Arabic Subtitle / Secondary Brand Name -->
  <text x="118" y="94" font-family="'Cairo', 'Tajawal', sans-serif" font-size="16" font-weight="600" fill="#71717A" letter-spacing="0.5">
    متجر مُحي • المنصة الإلكترونية الموحدة
  </text>
</svg>
